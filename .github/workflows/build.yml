name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reset and regenerate all source files
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          rm -f app/src/main/AndroidManifest.xml
          rm -f app/src/main/mainAndroidManifest.xml
          rm -f settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts
          mkdir -p app/src/main/java/com/example/jieqi

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "jieqi-assistant"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.jieqi"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.jieqi"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="JieQiHelper">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
                  <service android:name=".OverlayService" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/jieqi/Main.kt << 'EOF'
          package com.example.jieqi

          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private val reqCapture = 42

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER
                  root.setPadding(pad, pad, pad, pad)

                  status = TextView(this)
                  status.text = "JieQi Assistant"
                  root.addView(status)

                  val b1 = Button(this)
                  b1.text = "Enable overlay"
                  b1.setOnClickListener {
                      if (Settings.canDrawOverlays(this)) {
                          startService(Intent(this, OverlayService::class.java))
                      } else {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + packageName)))
                      }
                  }
                  root.addView(b1)

                  val b2 = Button(this)
                  b2.text = "Start capture"
                  b2.setOnClickListener {
                      val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
                  }
                  root.addView(b2)

                  setContentView(root)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqCapture && resultCode == RESULT_OK && data != null) {
                      CaptureService.start(this, resultCode, data)
                      status.text = "Capturing..."
                  }
              }
          }

          class CaptureService : Service() {
              private var projection: MediaProjection? = null
              private var vdisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  intent ?: return START_NOT_STICKY
                  startForegroundWithNotification()
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(
                      intent.getIntExtra(EXTRA_CODE, -1),
                      intent.getParcelableExtra(EXTRA_DATA)!!)

                  val metrics = resources.displayMetrics
                  reader = ImageReader.newInstance(
                      metrics.widthPixels, metrics.heightPixels, PixelFormat.RGBA_8888, 2)
                  reader?.setOnImageAvailableListener({ r ->
                      r.acquireLatestImage()?.use { img -> img.close() }
                  }, null)

                  vdisplay = projection!!.createVirtualDisplay(
                      "jieqi-capture", metrics.widthPixels, metrics.heightPixels, metrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader!!.surface, null, null)

                  projection!!.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, null)
                  return START_STICKY
              }

              private fun startForegroundWithNotification() {
                  val chId = "jieqi_capture"
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel(chId, "capture", NotificationManager.IMPORTANCE_LOW))
                  val n = NotificationCompat.Builder(this, chId)
                      .setContentTitle("JieQi Helper")
                      .setContentText("capturing")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else
                      startForeground(1, n)
              }

              override fun onDestroy() {
                  vdisplay?.release()
                  reader?.close()
                  projection?.stop()
                  super.onDestroy()
              }

              companion object {
                  const val EXTRA_CODE = "code"
                  const val EXTRA_DATA = "data"
                  fun start(ctx: Context, code: Int, data: Intent) =
                      ContextCompat.startForegroundService(ctx,
                          Intent(ctx, CaptureService::class.java)
                              .putExtra(EXTRA_CODE, code)
                              .putExtra(EXTRA_DATA, data))
              }
          }

          class OverlayService : Service() {
              private lateinit var wm: WindowManager

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val overlay = View(this)
                  wm.addView(overlay, WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT))
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jieqi-apk
          path: app/build/outputs/apk/debug/*.apk
