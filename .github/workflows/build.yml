name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          # ubuntu-latest 已预装 Android SDK；直接用 sdkmanager 确保 compileSdk 34 与 build-tools 就绪
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "sdk dirs:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Install 7z / p7zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch Pikafish arm64 engine (CI only, not committed)
        run: |
          set -e
          mkdir -p app/src/main/assets/engine
          # 从 Pikafish 官方 Release 下载 7z 包
          curl -L --retry 3 -o /tmp/pikafish.7z \
            "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z"
          7z x -y -o/tmp/pikafish_extract /tmp/pikafish.7z >/dev/null
          echo "=== 解压后的全部文件 ==="
          find /tmp/pikafish_extract -type f -printf '%p (%s bytes)\n' | head -80
          # 按 ELF 文件头识别 Android arm64/aarch64 可执行文件，不依赖文件名
          # 1) 优先：文件名含 android 且为 aarch64 ELF
          ENGINE=""
          for f in $(find /tmp/pikafish_extract -type f); do
            if file "$f" 2>/dev/null | grep -q "ELF 64-bit.*ARM aarch64"; then
              case "$f" in
                *ndroid*|*arm64*|*aarch64*|*universal*) ENGINE="$f"; break ;;
              esac
            fi
          done
          # 2) 兜底：任意 aarch64 ELF 可执行文件
          if [ -z "$ENGINE" ]; then
            ENGINE=$(find /tmp/pikafish_extract -type f -exec sh -c \
              'file "$1" 2>/dev/null | grep -q "ELF 64-bit.*ARM aarch64" && echo "$1"' _ {} \; | head -1)
          fi
          if [ -z "$ENGINE" ]; then
            echo "::warning::未找到可用的 arm64 引擎，APK 将以纯统计模式降级运行"
            echo "placeholder" > app/src/main/assets/engine/pikafish
          else
            echo "使用引擎: $ENGINE"
            cp "$ENGINE" app/src/main/assets/engine/pikafish
            chmod +x app/src/main/assets/engine/pikafish
            ls -lh app/src/main/assets/engine/pikafish
            file app/src/main/assets/engine/pikafish
            # NNUE 权重文件：Pikafish 必需，缺失则引擎无法工作（表现为一直统计模式）
            NNUE=$(find /tmp/pikafish_extract -type f -iname '*.nnue' | head -1)
            if [ -n "$NNUE" ]; then
              echo "打包 NNUE 权重: $NNUE"
              cp "$NNUE" app/src/main/assets/engine/pikafish.nnue
              ls -lh app/src/main/assets/engine/pikafish.nnue
            else
              echo "::warning::未找到 nnue 权重文件，引擎可能无法工作"
            fi
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "找到 APK: $APK"
          ls -lh "$APK"

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: JJ揭棋助手 v1.0.0 (build ${{ github.run_number }})
          body: |
            ## JJ象棋揭棋模式自动辅助
            自动编译发布。下载 APK 安装即可。

            首次运行顺序：
            1. 开启无障碍服务
            2. 授予悬浮窗权限
            3. 授予通知权限
            4. 棋盘校准
            5. 打开JJ象棋开局，启动辅助

            引擎：Pikafish arm64（CI 构建时获取，未提交二进制）
          files: ${{ steps.apk.outputs.path }}
          fail_on_assets_missing: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
