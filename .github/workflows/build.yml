name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install 7z / p7zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch Pikafish arm64 engine (CI only, not committed)
        run: |
          set -e
          mkdir -p app/src/main/assets/engine
          # 从 Pikafish 官方 Release 下载 7z 包
          curl -L --retry 3 -o /tmp/pikafish.7z \
            "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z"
          7z x -y -o/tmp/pikafish_extract /tmp/pikafish.7z >/dev/null
          echo "=== 解压后的文件 ==="
          find /tmp/pikafish_extract -maxdepth 3 -type f | head -50
          # 查找 Android arm64 可执行文件（常见命名：pikafish-android-arm64 / pikafish-arm64-android）
          ENGINE=$(find /tmp/pikafish_extract -type f \( \
            -iname '*android*arm64*' -o \
            -iname '*arm64*android*' -o \
            -iname 'pikafish-android*' \) | head -1)
          if [ -z "$ENGINE" ]; then
            echo "官方包未找到 android-arm64 二进制，尝试通用 aarch64/arm64 构建"
            ENGINE=$(find /tmp/pikafish_extract -type f \( \
              -iname '*aarch64*' -o -iname '*arm64*' \) \
              -exec sh -c 'file "$1" | grep -q "ELF 64-bit.*ARM aarch64"' _ {} \; -print | head -1)
          fi
          if [ -z "$ENGINE" ]; then
            echo "::warning::未找到可用的 arm64 引擎，APK 将以纯统计模式降级运行"
            echo "placeholder" > app/src/main/assets/engine/pikafish
          else
            echo "使用引擎: $ENGINE"
            cp "$ENGINE" app/src/main/assets/engine/pikafish
            chmod +x app/src/main/assets/engine/pikafish
            ls -lh app/src/main/assets/engine/pikafish
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "找到 APK: $APK"
          ls -lh "$APK"

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: JJ揭棋助手 v1.0.0 (build ${{ github.run_number }})
          body: |
            ## JJ象棋揭棋模式自动辅助
            自动编译发布。下载 APK 安装即可。

            首次运行顺序：
            1. 开启无障碍服务
            2. 授予悬浮窗权限
            3. 授予通知权限
            4. 棋盘校准
            5. 打开JJ象棋开局，启动辅助

            引擎：Pikafish arm64（CI 构建时获取，未提交二进制）
          files: ${{ steps.apk.outputs.path }}
          fail_on_assets_missing: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
